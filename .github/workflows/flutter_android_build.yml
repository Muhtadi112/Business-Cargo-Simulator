name: Flutter Android APK Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform when missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.adiexpress.game .
          fi

      - name: Configure Android test ads and minimum SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit(f"Android manifest tidak ditemukan: {manifest}")

          text = manifest.read_text()
          app_meta = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>'
          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              if "</application>" not in text:
                  raise SystemExit("Tag </application> tidak ditemukan di AndroidManifest.xml")
              text = text.replace("</application>", f"        {app_meta}\n    </application>")
          manifest.write_text(text)

          gradle_files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle = next((path for path in gradle_files if path.exists()), None)
          if gradle is None:
              raise SystemExit("File Gradle aplikasi Android tidak ditemukan.")

          gradle_text = gradle.read_text()
          if gradle.suffix == ".kts":
              if re.search(r"minSdk\s*=\s*\d+", gradle_text):
                  gradle_text = re.sub(r"minSdk\s*=\s*\d+", "minSdk = 23", gradle_text, count=1)
              else:
                  gradle_text = gradle_text.replace("minSdk = flutter.minSdkVersion", "minSdk = 23", 1)
          else:
              if re.search(r"minSdkVersion\s+\d+", gradle_text):
                  gradle_text = re.sub(r"minSdkVersion\s+\d+", "minSdkVersion 23", gradle_text, count=1)
              elif re.search(r"minSdk\s+\d+", gradle_text):
                  gradle_text = re.sub(r"minSdk\s+\d+", "minSdk 23", gradle_text, count=1)
              else:
                  gradle_text = gradle_text.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 23", 1)
          gradle.write_text(gradle_text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze --no-pub

      - name: Run game logic tests
        run: flutter test --no-pub

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Upload testing APK
        uses: actions/upload-artifact@v4
        with:
          name: ADIEXPRESS-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
