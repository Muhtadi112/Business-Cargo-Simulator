name: Flutter Android APK Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Automatically increment Android version code
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("pubspec.yaml")
          content = path.read_text()
          match = re.search(r"(?m)^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$", content)
          if not match:
              raise SystemExit("Format version di pubspec.yaml harus x.y.z+code.")

          version_name, version_code = match.groups()
          next_code = int(version_code) + 1
          updated = content[:match.start()] + f"version: {version_name}+{next_code}" + content[match.end():]
          path.write_text(updated)
          print(f"Android version: {version_name}+{next_code}")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump Android version code [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform when missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.adiexpress.game .
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          content = re.sub(r'android:label="[^"]*"', 'android:label="Business Cargo Simulator"', content, count=1)
          manifest.write_text(content)
          PY

      - name: Ensure declared asset directories exist
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          content = Path("pubspec.yaml").read_text()
          match = re.search(r"(?ms)^flutter:\s*\n(.*?)(?=^\S|\Z)", content)
          assets = re.findall(r"^\s*-\s*([^#\s]+/?)\s*$", match.group(1), re.M) if match else []
          for item in assets:
              directory = Path(item.rstrip("/"))
              if directory.suffix:
                  continue
              directory.mkdir(parents=True, exist_ok=True)
              if not any(directory.iterdir()):
                  (directory / ".gitkeep").touch()
          PY

      - name: Configure Android test ads and minimum SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit(f"Android manifest tidak ditemukan: {manifest}")

          text = manifest.read_text()
          app_meta = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>'
          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              if "</application>" not in text:
                  raise SystemExit("Tag </application> tidak ditemukan di AndroidManifest.xml")
              text = text.replace("</application>", f"        {app_meta}\n    </application>")
          manifest.write_text(text)

          gradle_files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle = next((path for path in gradle_files if path.exists()), None)
          if gradle is None:
              raise SystemExit("File Gradle aplikasi Android tidak ditemukan.")

          gradle_text = gradle.read_text()
          if gradle.suffix == ".kts":
              if re.search(r"minSdk\s*=\s*\d+", gradle_text):
                  gradle_text = re.sub(r"minSdk\s*=\s*\d+", "minSdk = 23", gradle_text, count=1)
              else:
                  gradle_text = gradle_text.replace("minSdk = flutter.minSdkVersion", "minSdk = 23", 1)
          else:
              if re.search(r"minSdkVersion\s+\d+", gradle_text):
                  gradle_text = re.sub(r"minSdkVersion\s+\d+", "minSdkVersion 23", gradle_text, count=1)
              elif re.search(r"minSdk\s+\d+", gradle_text):
                  gradle_text = re.sub(r"minSdk\s+\d+", "minSdk 23", gradle_text, count=1)
              else:
                  gradle_text = gradle_text.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 23", 1)
          gradle.write_text(gradle_text)

          # Keep the Android package identity stable across every generated build.
          gradle_text = gradle.read_text()
          package_name = "com.adiexpress.game"

          def block_bounds(source, block_name, start_at=0):
              match = re.search(r"(?m)^\s*" + re.escape(block_name) + r"\s*\{", source[start_at:])
              if not match:
                  return None
              open_brace = start_at + match.end() - 1
              depth = 0
              for pos in range(open_brace, len(source)):
                  if source[pos] == "{":
                      depth += 1
                  elif source[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return open_brace, pos
              raise SystemExit(f"Blok {block_name} tidak valid.")

          android_bounds = block_bounds(gradle_text, "android")
          if not android_bounds:
              raise SystemExit("Blok android tidak ditemukan.")
          a_open, a_close = android_bounds

          def set_gradle_property(source, prop, value, bounds, kotlin):
              start, end = bounds
              pattern = r"(?m)^([ \t]*)" + re.escape(prop) + r"\s*(?:=\s*)?['\\"][^'\\"]*['\\"]\s*$"
              replacement = lambda m: m.group(1) + (prop + ' = "' + value + '"' if kotlin else prop + ' "' + value + '"')
              section = source[start:end+1]
              if re.search(pattern, section):
                  section = re.sub(pattern, replacement, section, count=1)
              else:
                  indent = "        " if prop == "applicationId" else "    "
                  statement = prop + ' = "' + value + '"' if kotlin else prop + ' "' + value + '"'
                  section += "\n" + indent + statement + "\n"
              return source[:start] + section + source[end+1:]

          is_kotlin = gradle.suffix == ".kts"
          gradle_text = set_gradle_property(gradle_text, "namespace", package_name, (a_open, a_close), is_kotlin)

          default_bounds = block_bounds(gradle_text, "defaultConfig", a_open)
          if not default_bounds:
              raise SystemExit("Blok defaultConfig tidak ditemukan.")
          gradle_text = set_gradle_property(gradle_text, "applicationId", package_name, default_bounds, is_kotlin)
          gradle.write_text(gradle_text)

          # Verify the exact package identity before building the APK.
          verified = gradle.read_text()
          if package_name not in verified or not re.search(r"(?m)^\s*applicationId\s*(?:=\s*)?['\\"]" + re.escape(package_name) + r"['\\"]", verified) or not re.search(r"(?m)^\s*namespace\s*(?:=\s*)?['\\"]" + re.escape(package_name) + r"['\\"]", verified):
              raise SystemExit("namespace/applicationId tidak konsisten dengan com.adiexpress.game.")

          # Disable release lint checks to avoid the video_player_android
          # List.removeLast() NoSuchMethodError on the Android lint runtime.
          gradle_text = gradle.read_text()
          if re.search(r"(?m)^\s*lint\s*\{", gradle_text):
              raise SystemExit("Blok lint sudah ada; periksa konfigurasi agar tidak terjadi duplikasi.")

          android_match = re.search(r"(?m)^\s*android\s*\{", gradle_text)
          if not android_match:
              raise SystemExit("Blok android { ... } tidak ditemukan di file Gradle.")

          open_brace = gradle_text.find("{", android_match.start())
          depth = 0
          close_brace = None
          for index in range(open_brace, len(gradle_text)):
              if gradle_text[index] == "{":
                  depth += 1
              elif gradle_text[index] == "}":
                  depth -= 1
                  if depth == 0:
                      close_brace = index
                      break
          if close_brace is None:
              raise SystemExit("Blok android tidak memiliki kurung penutup yang valid.")

          if gradle.suffix == ".kts":
              lint_config = "\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n"
          else:
              lint_config = "\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n"
          gradle_text = gradle_text[:close_brace] + lint_config + gradle_text[close_brace:]
          gradle.write_text(gradle_text)
          PY

      - name: Generate world map and original launcher icon assets
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          import json
          from PIL import Image, ImageDraw

          maps = Path("assets/maps")
          icons = Path("assets/icons")
          maps.mkdir(parents=True, exist_ok=True)
          icons.mkdir(parents=True, exist_ok=True)
          world = maps / "world_map_dark.png"
          if not world.exists():
              source = "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_land.geojson"
              with urlopen(source, timeout=60) as response:
                  geo = json.loads(response.read().decode("utf-8"))
              scale = 2
              image = Image.new("RGBA", (4400, 2200), (255, 255, 255, 0))
              draw = ImageDraw.Draw(image)
              def project(ring):
                  return [((lon + 180) / 360 * 4400, (90 - lat) / 180 * 2200) for lon, lat, *_ in ring]
              for feature in geo["features"]:
                  geometry = feature.get("geometry") or {}
                  kind, coords = geometry.get("type"), geometry.get("coordinates", [])
                  polygons = [coords] if kind == "Polygon" else coords if kind == "MultiPolygon" else []
                  for polygon in polygons:
                      if polygon:
                          draw.polygon(project(polygon[0]), fill=(255, 255, 255, 255))
              image.resize((2200, 1100), Image.Resampling.LANCZOS).save(world, optimize=True)

          icon = Image.new("RGBA", (1024, 1024), (13, 21, 26, 255))
          d = ImageDraw.Draw(icon)
          emerald = (46, 229, 157, 255)
          hexagon = [(512,105),(835,292),(835,665),(512,850),(189,665),(189,292)]
          d.line(hexagon + [hexagon[0]], fill=emerald, width=34, joint="curve")
          d.ellipse((310,250,714,654), outline=emerald, width=24)
          d.arc((395,250,629,654),70,290,fill=emerald,width=18)
          d.arc((395,250,629,654),250,110,fill=emerald,width=18)
          d.arc((310,340,714,560),0,180,fill=emerald,width=18)
          d.rounded_rectangle((280,590,610,760),radius=28,fill=emerald)
          d.polygon([(610,640),(715,640),(785,715),(785,760),(610,760)],fill=emerald)
          d.rectangle((665,660,715,705),fill=(13,21,26,255))
          d.ellipse((345,720,430,805),fill=(13,21,26,255),outline=emerald,width=18)
          d.ellipse((650,720,735,805),fill=(13,21,26,255),outline=emerald,width=18)
          icon.save(icons / "app_icon.png", optimize=True)
          PY

      - name: Remove generated default widget test
        shell: bash
        run: |
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then
            rm test/widget_test.dart
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib test

      - name: Run static analysis
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run game logic tests
        run: flutter test --no-pub

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Upload testing APK
        uses: actions/upload-artifact@v4
        with:
          name: ADIEXPRESS-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
