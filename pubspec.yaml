name: business_cargo_simulator
description: A global logistics and fleet management tycoon game by ADI.
publish_to: "none"
version: 0.1.0+3
environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  uuid: ^4.5.1
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/maps/
    - assets/data/

flutter_launcher_icons:
  image_path: "assets/icons/app_icon.png"
  android: true
  ios: false
